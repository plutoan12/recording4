name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: 파이썬 검사
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recording4
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: recording4_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recording4 -d recording4_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # PostgreSQL에서 돌려야 행 잠금(동시 예약) 테스트가 실제로 실행됩니다.
      R4_DATABASE_URL: postgresql+psycopg://recording4:devpass@localhost:5432/recording4_test
      R4_JWT_SECRET: ci-secret-value

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # providers를 함께 설치합니다. 업로드 재개 규약 테스트가 실제 Google SDK를
      # 가짜 서버에 붙여 돌기 때문입니다. torch를 끌어오지 않아 가볍습니다.
      - name: 의존성 설치
        run: pip install -e ".[dev,providers]"

      - name: 린트
        run: ruff check .

      - name: 포맷 확인
        run: ruff format --check .

      - name: 마이그레이션 왕복
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: FFmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 테스트
        run: pytest -q

      # 번역 결과가 목표 언어 자막 규칙 안에 들어가는지 봅니다. 번역이 맞아도
      # 자막으로 안 들어가면 화면에서는 깨집니다. 유료 호출은 하지 않습니다
      # (--allow-paid 없음). 실제 번역 품질 측정은 자격증명이 있는 곳에서
      # 사람이 돌립니다. docs/TRANSLATION_CHECK.md를 보세요.
      - name: 번역 자막 규칙 확인 (무료)
        run: python3 scripts/verify_translate.py --pairs docs/samples/ko-en.json

  web:
    name: 관리화면 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 빌드
        run: npm run build

  stack:
    name: 스택 기동 검증
    runs-on: ubuntu-latest
    # 이미지 두 개와 웹 서버를 빌드하고 전체 경로를 한 번 돌립니다. 느립니다.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 60

    # compose 파일이 이 값으로 비밀값 파일을 찾습니다. ops.py는 스스로 넣지만
    # 로그와 정리 단계는 docker compose를 직접 부르므로 잡 수준에 둡니다.
    env:
      R4_ENV_FILE: ${{ github.workspace }}/.runtime/production.env

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 디스크 확보
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # 지금까지 Compose 전체 기동과 실제 S3 연결은 "개발 환경에서 한 번 돌려봐야
      # 한다"로 남아 있었습니다. 운영에서 쓰는 구성(compose.runtime.yml)을 그대로
      # 띄웁니다. ops.py가 비밀값을 만들고 헬스체크가 통과할 때까지 기다립니다.
      - name: 운영 스택 기동
        run: |
          python3 scripts/ops.py init
          python3 scripts/ops.py up
          python3 scripts/ops.py status

      # 로그인 → 원본 업로드(실제 S3 PUT) → 검증 → 제작 → 결과물 내려받기 →
      # FFmpeg 디코딩까지 한 번에 돕니다. 유료 호출과 업로드는 하지 않습니다.
      - name: 전 경로 스모크
        run: python3 scripts/smoke.py

      - name: 실패 시 로그
        if: failure()
        run: |
          python3 scripts/ops.py status || true
          docker compose --env-file "$R4_ENV_FILE" \
            -f infra/compose.runtime.yml logs --tail 200 || true

      - name: 정리
        if: ${{ !cancelled() }}
        run: |
          docker compose --env-file "$R4_ENV_FILE" \
            -f infra/compose.runtime.yml down -v || true

  images:
    name: 워커 이미지 빌드
    runs-on: ubuntu-latest
    # 느린 잡이라 PR과 main에서만 돌립니다. 중간 브랜치 푸시마다 반복하지 않습니다.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # CPU 전용 PyTorch와 자막 의존성을 내려받으므로 오래 걸립니다.
    timeout-minutes: 45

    # 단계 if에서는 secrets 컨텍스트를 쓸 수 없어 잡 수준 env로 받습니다.
    # 시크릿이 없으면 빈 값이 되고, 그 값을 보고 화자 분리 검증을 건너뜁니다.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # 러너 기본 디스크로는 PyTorch 계열 설치가 빠듯합니다. 쓰지 않는 도구를 지웁니다.
      - name: 디스크 확보
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # 이 저장소에서 유일하게 CI가 검증하지 못하던 부분입니다. 워커 이미지는
      # FFmpeg·글꼴·CPU PyTorch·자막 의존성을 설치하므로 설치 해결이 깨지면
      # 배포 시점에야 드러납니다. 밀어 올리지 않고 빌드만 확인합니다.
      - name: 워커 이미지 빌드
        run: docker build -f infra/Dockerfile.worker -t recording4-worker:ci .

      - name: 이미지 크기 확인
        run: docker image ls recording4-worker:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      # 설치 결과가 실제로 쓸 수 있는 상태인지 확인합니다. 모델은 내려받지 않습니다.
      - name: 워커 의존성 임포트 확인
        run: |
          docker run --rm --entrypoint python recording4-worker:ci -c "
          import torch, stable_whisper, whisperx, kss, pysubs2, faster_whisper, speechbrain
          from worker.analysis import align_text, diarize, diarize_by_embedding
          from pipeline.subtitles import apply_rules
          from pipeline.speakers import assign_speakers
          assert '+cpu' in torch.__version__, torch.__version__
          # 화자 분리 진입점이 이 whisperx 버전에 실제로 있는지 확인합니다.
          # 모델은 내려받지 않습니다. 토큰이 없으면 호출 전에 막힙니다.
          try:
              from whisperx.diarize import DiarizationPipeline
          except ImportError:
              from whisperx import DiarizationPipeline
          print('torch', torch.__version__, '/ 워커 모듈 임포트 ok')
          print('화자 분리 진입점', DiarizationPipeline.__module__)
          from speechbrain.inference.speaker import EncoderClassifier
          print('목소리 특징 진입점', EncoderClassifier.__module__)
          # 배경음 분리는 torchaudio가 싣고 있는 모델을 씁니다. 별도 패키지를
          # 넣지 않으려고 고른 것이라, 이 번들이 없으면 방법부터 다시 정해야
          # 합니다. 모델을 내려받지는 않습니다.
          import torchaudio
          bundle = getattr(torchaudio.pipelines, 'HDEMUCS_HIGH_MUSDB_PLUS', None)
          print('torchaudio', torchaudio.__version__, '/ 배경음 분리 번들', bundle is not None)
          assert bundle is not None, (
              'torchaudio에 HDEMUCS_HIGH_MUSDB_PLUS가 없습니다. worker/separation.py를 고쳐야 합니다.'
          )
          print('분리 갈래', bundle.sources if hasattr(bundle, 'sources') else '(모델을 받아야 알 수 있음)')
          "

      - name: API 이미지 빌드
        run: docker build -f infra/Dockerfile.api -t recording4-api:ci .

      # 실제 모델을 내려받아 정렬 품질을 재는 검사입니다. 느리고 네트워크를 타므로
      # PR에 verify-align 라벨을 붙이거나 커밋 메시지에 [verify-align]을 넣을 때만
      # 돌립니다. 합성 음성이라 사람 목소리보다 불리한 조건입니다.
      - name: 정렬 품질 검증
        if: |
          contains(github.event.pull_request.labels.*.name, 'verify-align') ||
          contains(github.event.head_commit.message, '[verify-align]')
        run: |
          sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
          python3 scripts/make_speech_sample.py --out /tmp/align-sample
          # 운영 기본값과 같은 모델로 잽니다. tiny로 재면 우리가 쓰지도 않는
          # 모델의 단어 시각 오차를 재게 됩니다. 설정별 비교는 원인을 다 밝혀
          # 껐습니다. 필요하면 --no-diagnose를 빼고 다시 켭니다.
          docker run --rm -v /tmp/align-sample:/audio -v "$PWD/scripts:/work:ro" \
            --entrypoint python recording4-worker:ci /work/verify_align.py \
            --directory /audio --model small --no-diagnose

      # 합성 음성만으로는 사람 목소리 정확도를 말할 수 없습니다. 공개 한국어
      # 낭독 음성을 받아 같은 검사를 한 번 더 돌립니다. 받지 못하면 실패합니다.
      # 건너뛴 것과 통과한 것은 구분해야 합니다.
      - name: 정렬 품질 검증 (사람 목소리)
        if: |
          contains(github.event.pull_request.labels.*.name, 'verify-align') ||
          contains(github.event.head_commit.message, '[verify-align]')
        run: |
          python3 scripts/fetch_korean_speech.py --out /tmp/human-sample --count 3
          docker run --rm -v /tmp/human-sample:/audio -v "$PWD/scripts:/work:ro" \
            --entrypoint python recording4-worker:ci /work/verify_align.py \
            --directory /audio --model small --no-diagnose

      # 지금까지 STT는 불러오기와 설치만 확인했습니다. 실제로 무엇을 받아쓰는지는
      # 잰 적이 없습니다. 정렬은 대본이 있을 때 시각만 붙이는 일이라 전사 품질과
      # 다릅니다. 대본 없는 원본은 이 경로를 탑니다. 한계값은 품질 목표가 아니라
      # 회귀 감시용 상한입니다. 낭독 원문은 숫자를 한글로 적고 모델은 아라비아
      # 숫자로 적어서 같은 말이어도 글자가 다릅니다.
      - name: 전사 품질 검증 (사람 목소리)
        if: |
          contains(github.event.pull_request.labels.*.name, 'verify-align') ||
          contains(github.event.head_commit.message, '[verify-align]')
        run: |
          docker run --rm -v /tmp/human-sample:/audio -v "$PWD/scripts:/work:ro" \
            --entrypoint python recording4-worker:ci /work/verify_transcribe.py \
            --directory /audio --model small

      # 화자 분리를 토큰 없이도 한 번은 잽니다. 공개 목소리 특징 모델로 도는
      # 공급자라 시크릿이 필요 없습니다. 이게 통과해도 pyannote가 검증된 것은
      # 아닙니다. 둘은 다른 모델입니다. 우리 쪽 묶기·배정 규칙과 "두 목소리가
      # 실제로 갈리는가"를 실제 음성으로 확인하는 것입니다.
      - name: 화자 분리 검증 (토큰 없는 공급자)
        if: |
          contains(github.event.pull_request.labels.*.name, 'verify-align') ||
          contains(github.event.head_commit.message, '[verify-align]')
        run: |
          sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
          python3 scripts/make_two_speaker_sample.py --out /tmp/two-speaker \
            --human /tmp/human-sample
          docker run --rm -v /tmp/two-speaker:/audio -v "$PWD/scripts:/work:ro" \
            --entrypoint python recording4-worker:ci \
            /work/verify_diarize.py --directory /audio --provider embedding --max-speakers 2

      # 토큰이 없는 동안에도 "토큰이 잘못됐을 때" 경로는 확인할 수 있습니다.
      # 사람이 실제로 막히는 지점이 여기입니다. 토큰을 넣어도 약관 동의가
      # 빠지면 pyannote가 빈 모델을 돌려주고, 한참 뒤 엉뚱한 오류로 터집니다.
      - name: 화자 분리 토큰 오류 안내 점검
        if: |
          env.HF_TOKEN == '' && (
          contains(github.event.pull_request.labels.*.name, 'verify-align') ||
          contains(github.event.head_commit.message, '[verify-align]'))
        run: |
          docker run --rm -v /tmp/two-speaker:/audio --entrypoint python \
            recording4-worker:ci -c "
          from pathlib import Path
          from worker.analysis import MissingDependency, default_model_name, diarize
          try:
              from whisperx.diarize import DiarizationPipeline
          except ImportError:
              from whisperx import DiarizationPipeline
          # 이 버전이 어떤 모델을 쓰는지 기록합니다. 약관 동의는 그 페이지에서 합니다.
          print('이 버전이 쓰는 모델:', default_model_name(DiarizationPipeline))
          try:
              diarize(Path('/audio/sample.wav'), token='not-a-real-token', device='cpu')
          except MissingDependency as exc:
              text = str(exc)
              # 막힌 저장소를 그대로 짚어 줘야 합니다. 엉뚱한 페이지를 적으면
              # 사람이 동의를 다 해 놓고도 같은 오류를 다시 봅니다.
              assert 'speaker-diarization-community-1' in text, text
              assert 'segmentation-3.0' in text, text
              print('토큰이 잘못됐을 때 이렇게 안내합니다:')
              print(text)
          else:
              raise SystemExit('잘못된 토큰으로 통과했습니다. 점검이 헛돕니다.')
          "

      # pyannote는 게이트 모델이라 토큰이 있어야 돌아갑니다. 저장소 시크릿에
      # HF_TOKEN을 넣으면 이 단계가 켜집니다. 없으면 건너뜁니다.
      - name: 화자 분리 검증 (pyannote)
        if: ${{ env.HF_TOKEN != '' }}
        env:
          R4_HF_TOKEN: ${{ env.HF_TOKEN }}
        run: |
          docker run --rm -v /tmp/two-speaker:/audio -v "$PWD/scripts:/work:ro" \
            -e R4_HF_TOKEN --entrypoint python recording4-worker:ci \
            /work/verify_diarize.py --directory /audio --provider pyannote --max-speakers 2

      # 자막 기본값이 실제 세로 화면에서 여백 안에 한 줄로 들어가는지 렌더해서 잽니다.
      # 폰트 메트릭 계산이 아니라 libass 렌더 결과를 FFmpeg cropdetect로 측정합니다.
      # 분리는 모델을 내려받고 CPU에서 느립니다. 정렬 검증과 같은 라벨에서만
      # 돌립니다. 아는 두 소리(합성 음성 + 순음)를 섞어 무엇이 남는지 잽니다.
      - name: 배경음 분리 검증
        if: |
          contains(github.event.pull_request.labels.*.name, 'verify-align') ||
          contains(github.event.head_commit.message, '[verify-align]')
        run: |
          sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
          # 합성 음성은 워커 이미지에 없습니다. 표본은 러너에서 만들고 넘깁니다.
          python3 scripts/verify_separation.py --make --out /tmp/separation
          docker run --rm -v /tmp/separation:/audio -v "$PWD/scripts:/work:ro" \
            --entrypoint python recording4-worker:ci \
            /work/verify_separation.py --directory /audio

      - name: 자막 화면 측정
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD/scripts:/work:ro" --entrypoint python \
            recording4-worker:ci /work/measure_subtitles.py

      # 빌드 로그가 길어서 중간 출력은 찾기 어렵습니다. 잡 끝에서 한 번 더 모읍니다.
      # 얼굴 검출은 세로 자르기 제안에만 씁니다. 여기서 재는 것은 오검출뿐입니다.
      # 진짜 얼굴을 얼마나 잘 찾는지는 얼굴이 든 표본이 없어 재지 않습니다.
      - name: 얼굴 검출 오검출 점검
        run: |
          docker run --rm -v "$PWD/scripts:/work:ro" --entrypoint python \
            recording4-worker:ci /work/verify_faces.py --out /tmp/faces

      - name: 이미지 요약
        if: ${{ !cancelled() }}
        run: |
          docker image ls recording4-worker:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker image ls recording4-api:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker run --rm --entrypoint python recording4-worker:ci \
            -c "import torch; print('torch', torch.__version__)"
