name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: 파이썬 검사
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recording4
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: recording4_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recording4 -d recording4_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # PostgreSQL에서 돌려야 행 잠금(동시 예약) 테스트가 실제로 실행됩니다.
      R4_DATABASE_URL: postgresql+psycopg://recording4:devpass@localhost:5432/recording4_test
      R4_JWT_SECRET: ci-secret-value

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -e ".[dev]"

      - name: 린트
        run: ruff check .

      - name: 포맷 확인
        run: ruff format --check .

      - name: 마이그레이션 왕복
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: 테스트
        run: pytest -q

  web:
    name: 관리화면 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 빌드
        run: npm run build
