[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recording4"
version = "0.1.0"
description = "영상 번역·더빙·숏폼 편집 파이프라인의 관리 API와 워커"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "email-validator==2.2.0",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "celery==5.4.0",
    "redis==5.2.1",
    "boto3==1.35.81",
    "pyjwt==2.10.1",
    "python-multipart==0.0.20",
    "pysubs2==1.8.0",
    # 자막 파일 인코딩 판별. 라이선스가 MIT입니다(chardet은 LGPL이라 쓰지 않습니다).
    "charset-normalizer==3.5.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
imports = ["yt-dlp[default]==2026.8.19"]
# OpenCV는 scenedetect가 끌어오지만 버전을 여기서 못 박습니다. 5.0.0 휠에는
# 얼굴 검출(cv2.CascadeClassifier)이 없습니다(CI 실측: "이 cv2에는
# CascadeClassifier가 없습니다... 버전 5.0.0"). 4.x에는 있습니다.
analysis = [
    "faster-whisper==1.2.1",
    "scenedetect[opencv-headless]==0.6.7.1",
    "opencv-python-headless==4.14.0.94",
]
# 자막 정밀화. torch를 끌어오므로 설치량이 큽니다. CPU 전용 설치는 docs/OPEN_SOURCE_INTEGRATIONS.md를 봅니다.
# speechbrain은 토큰 없이 도는 화자 분리(목소리 특징)용입니다. pyannote 모델은
# 게이트라 토큰이 필요한데, 이쪽은 공개 모델로 같은 일을 합니다. 품질은 다릅니다.
subtitles = [
    "stable-ts==2.19.1",
    "whisperx==3.8.6",
    "kss==6.0.6",
    "speechbrain==1.1.1",
    "ffsubsync==0.4.27",
]
# 로컬 번역 모델(NLLB-200, R4_TRANSLATION_PROVIDER=huggingface). torch는 subtitles 묶음이
# 이미 끌어옵니다. 시험은 대역으로 돌므로 없어도 됩니다. 실제 모델로 잰 값은 아직 없습니다.
translation = ["transformers==5.17.0", "sentencepiece==0.2.1"]
providers = [
    "google-cloud-translate==3.20.2",
    "google-api-python-client==2.160.0",
    "google-auth-oauthlib==1.2.1",
    # 하이라이트 추천. 대역으로 시험하므로 없어도 시험은 돕니다.
    "anthropic==1.7.0",
]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.4",
    # scripts/verify_sync_matrix.py가 numpy로 음성을 만듭니다. 그 시험이 스크립트를
    # 통째로 불러오므로 시험에도 필요합니다(CI 실측: ModuleNotFoundError). 워커
    # 이미지는 torch·opencv가 각자 끌어오므로 여기 고정과 섞이지 않습니다.
    "numpy==2.4.6",
]

[tool.setuptools]
# 공유 도메인 패키지만 설치합니다. API·워커는 PYTHONPATH로 불러옵니다.
package-dir = {"" = "packages/pipeline"}
packages = ["pipeline"]

[tool.pytest.ini_options]
pythonpath = ["packages/pipeline", "services/api", "services/worker"]
testpaths = ["tests"]
markers = [
    "postgres: PostgreSQL 전용 테스트. DATABASE_URL이 PostgreSQL일 때만 실행합니다.",
]
filterwarnings = ["error::DeprecationWarning:adminapi.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/pipeline", "services/api", "services/worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI는 의존성을 기본 인자로 선언합니다.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
