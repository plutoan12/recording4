# 개발용 구성입니다. 운영 배포 구성은 별도입니다.
name: recording4

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recording4
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: recording4
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recording4']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # 개발용 S3 호환 저장소. 운영에서는 외부 객체 저장소를 씁니다.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-setup:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/recording4-dev &&
      mc anonymous set none local/recording4-dev"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      R4_DATABASE_URL: postgresql+psycopg://recording4:devpass@postgres:5432/recording4
      R4_REDIS_URL: redis://redis:6379/0
      R4_JWT_SECRET: ${R4_JWT_SECRET:-dev-secret-change-me}
      R4_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ['8000:8000']
    command: >
      /bin/sh -c "alembic upgrade head &&
      uvicorn adminapi.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      R4_DATABASE_URL: postgresql+psycopg://recording4:devpass@postgres:5432/recording4
      R4_REDIS_URL: redis://redis:6379/0
      R4_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  dispatcher:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      R4_DATABASE_URL: postgresql+psycopg://recording4:devpass@postgres:5432/recording4
      R4_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ['python', '-m', 'worker.run_dispatcher']

volumes:
  pgdata:
  miniodata:
