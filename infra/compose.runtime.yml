name: recording4-stack
x-app: &app
  env_file: ['${R4_ENV_FILE:?Run scripts/ops.py init first}']
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recording4
      POSTGRES_DB: recording4
      POSTGRES_PASSWORD: ${R4_DB_PASSWORD:?}
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recording4 -d recording4']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${R4_S3_ACCESS_KEY_ID:?}
      MINIO_ROOT_PASSWORD: ${R4_S3_SECRET_ACCESS_KEY:?}
    volumes: ['objects:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    build: {context: .., dockerfile: infra/Dockerfile.api}
    command: ['/bin/sh', '-c', 'alembic upgrade head && python -m adminapi.bootstrap && exec uvicorn adminapi.main:app --host 0.0.0.0 --port 8000 --no-access-log']
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
  worker:
    <<: *app
    build: {context: .., dockerfile: infra/Dockerfile.worker}
    volumes: ['models:/home/appuser/.cache', 'provider_secrets:/run/secrets:ro']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ['CMD-SHELL', 'celery -A worker.celery_app.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  dispatcher:
    <<: *app
    build: {context: .., dockerfile: infra/Dockerfile.worker}
    command: ['python', '-m', 'worker.run_dispatcher']
    depends_on:
      api: {condition: service_healthy}
  monitor:
    <<: *app
    build: {context: .., dockerfile: infra/Dockerfile.worker}
    command: ['python', '-m', 'worker.operations']
    user: "0:0"
    volumes: ['ops_status:/var/recording4', '${R4_BACKUP_DIR:?}:/backups']
    depends_on:
      api: {condition: service_healthy}
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: recording4
      PGDATABASE: recording4
      PGPASSWORD: ${R4_DB_PASSWORD:?}
    volumes:
      - ${R4_BACKUP_DIR:?}:/backups
      - ./runtime/backup.sh:/backup.sh:ro
    command: ['/bin/sh', '/backup.sh']
    depends_on:
      api: {condition: service_healthy}
  web:
    build: {context: .., dockerfile: infra/Dockerfile.web}
    restart: unless-stopped
    environment:
      R4_SITE_ADDRESS: ${R4_SITE_ADDRESS:-http://localhost}
    ports:
      - '${R4_BIND_IP:-127.0.0.1}:${R4_HTTP_PORT:-18444}:80'
      - '${R4_BIND_IP:-127.0.0.1}:${R4_HTTPS_PORT:-18445}:443'
    volumes: ['caddy_data:/data', 'caddy_config:/config']
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  objects:
  models:
  caddy_data:
  caddy_config:
  provider_secrets:
  ops_status:
